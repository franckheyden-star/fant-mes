<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantome Chat</title>

<style>
/* ===== BASE (PC) ===== */
body {
  margin: 0;
  font-family: Arial;
  background: #0b141a;
  color: white;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

#sidebar {
  width: 25%;
  min-width: 200px;
  background: #111b21;
  padding: 10px;
  overflow-y: auto;
}

#chatArea {
  flex: 1;
  display: flex;
  flex-direction: column;
}

header {
  background: #202c33;
  padding: 10px;
  text-align: center;
  font-size: 18px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
}

.msg {
  padding: 8px 12px;
  margin: 5px;
  border-radius: 10px;
  max-width: 70%;
  word-wrap: break-word;
}

.left  { background: #202c33; align-self: flex-start; }
.right { background: #005c4b; align-self: flex-end; }

.system {
  text-align: center;
  color: gray;
  font-size: 12px;
  margin: 4px 0;
}

#bar {
  display: flex;
  padding: 10px;
  background: #202c33;
  gap: 8px;
}

input, button {
  padding: 10px;
  border: none;
  border-radius: 20px;
}

#msg {
  flex: 1;
  background: #2a3942;
  color: white;
  font-size: 15px;
}

button {
  background: #00a884;
  color: white;
  cursor: pointer;
  font-size: 15px;
  padding: 10px 16px;
}

/* ===== MOBILE / ANDROID (max 768px) ===== */
@media (max-width: 768px) {

  body {
    flex-direction: column;
    height: 100dvh; /* dynamic viewport height pour Android */
  }

  #sidebar {
    width: 100%;
    min-width: unset;
    height: auto;
    padding: 6px 10px;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    overflow-x: auto;
    white-space: nowrap;
  }

  #sidebar h3 {
    margin: 0;
    font-size: 14px;
    flex-shrink: 0;
  }

  #online {
    display: flex;
    flex-direction: row;
    gap: 10px;
    overflow-x: auto;
    font-size: 13px;
  }

  #chatArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  header {
    font-size: 15px;
    padding: 8px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .msg {
    max-width: 85%;
    font-size: 14px;
  }

  #bar {
    padding: 8px;
    position: sticky;
    bottom: 0;
  }

  #msg {
    font-size: 16px; /* 茅vite le zoom automatique sur iOS/Android */
  }

  button {
    font-size: 16px;
    padding: 10px 14px;
  }
}
</style>
</head>

<body>

<div id="sidebar">
  <h3>馃懃 En ligne</h3>
  <div id="online"></div>
</div>

<div id="chatArea">
  <header>馃懟 Fantome Chat</header>
  <div id="chat"></div>
  <div id="bar">
    <input id="msg" placeholder="message..." autocomplete="off">
    <button onclick="send()">鉃�</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let username = prompt("Ton pseudo ?");
socket.emit("login", username);

// messages
socket.on("message", (d) => {
  const div = document.createElement("div");
  div.className = "msg " + (d.user === username ? "right" : "left");
  div.innerHTML = "<b>" + d.user + ":</b> " + d.text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView();
});

// system
socket.on("system", (msg) => {
  const div = document.createElement("div");
  div.className = "system";
  div.innerText = msg;
  document.getElementById("chat").appendChild(div);
});

// online
socket.on("online", (list) => {
  document.getElementById("online").innerHTML =
    list.map(u => "馃煝 " + u).join("<br>");
});

// send
function send() {
  const input = document.getElementById("msg");
  if (!input.value.trim()) return;
  socket.emit("message", { text: input.value });
  input.value = "";
}

// Envoyer avec la touche Entr茅e
document.getElementById("msg").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});
</script>

</body>
</html>
