<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantome Chat</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b141a;
  color:white;
  display:flex;
  height:100vh;
}

#sidebar{
  width:25%;
  background:#111b21;
  padding:10px;
}

#chatArea{
  flex:1;
  display:flex;
  flex-direction:column;
}

header{
  background:#202c33;
  padding:10px;
  text-align:center;
}

#chat{
  flex:1;
  overflow-y:auto;
  padding:10px;
}

.msg{
  padding:8px;
  margin:5px;
  border-radius:10px;
  max-width:80%;
}

.left{background:#202c33; align-self:flex-start;}
.right{background:#005c4b; align-self:flex-end;}

.system{
  text-align:center;
  color:gray;
  font-size:12px;
}

#bar{
  display:flex;
  padding:10px;
  background:#202c33;
}

input,button{
  padding:10px;
  border:none;
  border-radius:20px;
}

#msg{flex:1;}
button{background:#00a884;color:white;}
</style>
</head>

<body>

<div id="sidebar">
<h3>👥 En ligne</h3>
<div id="online"></div>
</div>

<div id="chatArea">

<header>👻 Fantome Chat</header>

<div id="chat"></div>

<div id="bar">
<input id="msg" placeholder="message...">
<button onclick="send()">➤</button>
</div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

let username = prompt("Ton pseudo ?");
socket.emit("login", username);

// messages
socket.on("message", (d) => {
  const div = document.createElement("div");
  div.className = "msg " + (d.user === username ? "right" : "left");
  div.innerHTML = "<b>" + d.user + ":</b> " + d.text;

  document.getElementById("chat").appendChild(div);
});

// system
socket.on("system", (msg) => {
  const div = document.createElement("div");
  div.className = "system";
  div.innerText = msg;

  document.getElementById("chat").appendChild(div);
});

// online
socket.on("online", (list) => {
  document.getElementById("online").innerHTML =
    list.map(u => "🟢 " + u).join("<br>");
});

// send
function send(){
  const input = document.getElementById("msg");
  socket.emit("message", { text: input.value });
  input.value = "";
}
</script>

</body>
</html>
